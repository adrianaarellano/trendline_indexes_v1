<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index Selector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    select {
      margin-bottom: 20px;
      padding: 10px;
      font-size: 16px;
    }
    iframe {
      border: none;
      width: 80%;
      height: 700px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Index Selector</h1>
  <p>Select an index to explore the trend.</p>

  <!-- Dropdown for selecting an index -->
  <label for="indexSelector">Select Index:</label>
  <select id="indexSelector" onchange="switchMap()">
    <option value="overall" selected>Overall</option>
    <option value="non-system">Non-System</option>
    <option value="policy">Policy</option>
    <option value="practice">Practice</option>
    <option value="levels">Levels</option>
    <option value="equality">Equality</option>
  </select>

  <!-- The iframe container -->
  <iframe id="mapFrame" src="https://adrianaarellano.github.io/comp_trendline_overall/">
    Your browser does not support iframes.
  </iframe>

  <script>
    // Predefined mapping for index pages
    const indexPages = {
      "overall": "https://adrianaarellano.github.io/comp_trendline_overall/",
      "non-system": "https://adrianaarellano.github.io/comp_trendline_non_system/",
      "policy": "https://adrianaarellano.github.io/comp_trendline_policy/",
      "practice": "hhttps://adrianaarellano.github.io/comp_trendline_practice/",
      "levels": "hhttps://adrianaarellano.github.io/comp_trendline_levels/",
      "equality": "https://adrianaarellano.github.io/comp_trendline_equality/"
    };

    // Function to switch the iframe source
    function switchMap() {
      const selectedIndex = document.getElementById("indexSelector").value;
      document.getElementById("mapFrame").src = indexPages[selectedIndex];
    }
  </script>
</body>
</html>
